<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe | Formations BEYNE</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body class="login-page"><header><div class="head head-split login-head"><div class="header-logo header-logo-left"><img src="assets/logo-casa.png" alt="CASA Service Machine"></div><div class="header-center"><div class="brand">Formations <span>BEYNE</span></div></div><div class="header-logo header-logo-right"><img src="assets/logo-beyne.jpg" alt="BEYNE"></div></div></header><main class="login-wrap"><section class="login-card"><h1>Nouveau mot de passe</h1><p class="lead">Choisissez votre nouveau mot de passe.</p><form id="resetForm"><div class="field"><label for="newPassword">Nouveau mot de passe</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirmPassword">Confirmer le mot de passe</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="login-submit" type="submit">Enregistrer le mot de passe</button><div id="resetMessage" class="login-message" role="status"></div></form></section></main><footer>Support de formation client — BEYNE<br><span class="small">© 2026 — Tous droits réservés.</span><br><a href="mentions-legales.html">Mentions légales</a></footer><script>(function(){const cfg=window.BEYNE_SUPABASE||{};const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true,storage:window.sessionStorage}});const f=document.getElementById('resetForm'),m=document.getElementById('resetMessage');f.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){m.textContent='Les deux mots de passe ne correspondent pas.';m.className='login-message error';return;}const {error}=await client.auth.updateUser({password:a});if(error){m.textContent='Impossible de modifier le mot de passe.';m.className='login-message error';return;}m.textContent='Mot de passe modifié. Reconnectez-vous avec votre nouveau mot de passe…';m.className='login-message success';try{await client.auth.signOut({scope:'local'});}catch(e){}setTimeout(()=>location.replace('login.html'),1200);});})();</script></body></html>
